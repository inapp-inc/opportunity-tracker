services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: opportunity_tracker
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d opportunity_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: opportunity-tracker:latest
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://appuser:apppassword@db:5432/opportunity_tracker
      JWT_SECRET: change-me-before-going-live
      STATIC_AUTH_ENABLED: "true"
      STATIC_AUTH_EMAIL: demo@example.com
      STATIC_AUTH_PASSWORD: password
      CORS_ORIGINS: ""
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
